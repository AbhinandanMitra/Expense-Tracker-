<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login / Register - Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-illustration">
            <img src="{{ url_for('static', filename='exp_track_illus.jpg') }}" alt="Finance Illustration">
        </div>

        <div class="auth-content">
            <div class="form-box" id="login-box">
                <h2>Welcome Back</h2>
                <p>Enter your details to manage your expenses.</p>
                <form action="/" method="POST">

                    <div class="form-group">
                        <input type="text" name="username" autocomplete="off" autofocus="on" placeholder="Enter username..." required>
                        <small></small>
                    </div>

                    <div class="form-group">
                        <input type="password" name="password" placeholder="Enter password..." required>
                        <small></small>
                    </div>

                    <button type="submit" class="btn-primary">Login</button>
                </form>
                <p class="toggle-text">Don't have an account? <a href="#" onclick="toggleAuth()">Register here</a></p>
            </div>

            <div class="form-box" id="register-box" style="display: none;">
                <h2>Create Account</h2>
                <p>Start tracking your finances today.</p>
                <form action="/register" method="POST" id="registration-form">

                    <div class="form-group">
                        <input type="text" id="username" name="username" placeholder="Enter username..." autocomplete="off" autofocus="on" required />
                        <small></small>
                    </div>
                    
                    <div class="form-group">
                        <input type="email" id="email" placeholder="Enter email..." autocomplete="off" />
                        <small></small>
                    </div>
                    
                    <div class="form-group">
                        <input type="password" name="password" id="password" placeholder="Enter password..." required />
                        <small></small>
                    </div>

                    <div class="form-group">
                        <input type="password" id="confirmPassword" name="password" placeholder="Confirm password..." />
                        <small></small>
                    </div>

                    <button type="submit" class="btn-primary">Sign Up</button>
                </form>
                <p class="toggle-text">Already have an account? <a href="#" onclick="toggleAuth()">Login here</a></p>
            </div>
        </div>
    </div>

    <script>
        function toggleAuth() {
            const loginBox = document.getElementById('login-box');
            const registerBox = document.getElementById('register-box');
            if (loginBox.style.display === 'none') {
                loginBox.style.display = 'block';
                registerBox.style.display = 'none';
            } else 
            {
                loginBox.style.display = 'none';
                registerBox.style.display = 'block';

                const form = document.getElementById("registration-form");
                const username = document.getElementById("username");
                const email = document.getElementById("email");
                const password = document.getElementById("password");
                const confirmPassword = document.getElementById("confirmPassword");

                form.addEventListener("submit", (e) => {
                    const isRequiredValid = checkRequired([username, email, password, confirmPassword]);

                    let isFormValid = isRequiredValid;

                    if(isRequiredValid)
                        isFormValid = checkLength(username, 3, 15) && checkEmail(email) && checkLength(password,6,25) && checkPasswordMatch(password,confirmPassword);
                });

                function checkLength(input,min,max)
                {
                    if(input.value.length < min){
                        showError(input, `${formatFieldName(input)} must be at least ${min} characters.`);
                        return false
                    }
                    else if(input.value.length > max){
                        showError(input, `${formatFieldName(input)} must be less than ${max} characters.`);
                        return false;
                    }
                    else
                    {
                        showSuccess(input);
                        return true;
                    }
                }

                function checkEmail(email){
                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if(emailRegex.test(email.value.trim())){
                        showSuccess(email);
                        return true;
                    }else{
                        showError(email, "Email is not valid");
                        return false;
                    }
                }

                function checkPasswordMatch(input1, input2){
                    if(input1.value !== input2.value)
                    {
                        showError(input2, "Passwords do not match");
                        return false;
                    }
                    return true;
                }

                function checkRequired(inputArray){
                    let isValid = true;

                    inputArray.forEach( input => {
                        if(input.value.trim() === "")
                        {
                            showError(input, `${formatFieldName(input)} is required`);
                            isValid = false;
                        }
                        else{
                            showSuccess(input);
                        }
                    });

                    return isValid;
                }
                function formatFieldName(input){
                    return input.id.charAt(0).toUpperCase() + input.id.slice(1);
                }
                function showError(input,message){
                    const formGroup = input.parentElement;
                    formGroup.className = "form-group error";
                    const small = formGroup.querySelector("small");
                    small.innerText = message;
                }

                function showSuccess(input){
                    const formGroup = input.parentElement;
                    formGroup.className = "form-group success";
                }
            }
        }
    </script>
</body>
</html>
